name: SNES Enhanced 1.0
on:
  push:
    branches: [test-snes-enhanced-v1, test-snes-enhanced-inputs]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Check out official SNES source
        if: github.ref_name == 'test-snes-enhanced-inputs'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: MiSTer-devel/SNES_MiSTer
          ref: 3ac236af3013a4c96bdaf11b5a917a117f25dff6
          path: upstream
          sparse-checkout: |
            /*
            !/releases/
            !/hw/
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Apply SNES LLAPI integration
        if: github.ref_name == 'test-snes-enhanced-inputs'
        run: |
          cp enhanced/SNES.sv upstream/SNES.sv
          grep -Fx 'set_global_assignment -name SEED 1' upstream/SNES.qsf
          sed -i 's/^set_global_assignment -name SEED 1$/set_global_assignment -name SEED 2/' upstream/SNES.qsf
          cp rtl/llapi_enhanced.sv upstream/rtl/llapi_enhanced.sv
          printf '\nset_global_assignment -name SYSTEMVERILOG_FILE rtl/llapi_enhanced.sv\n' >> upstream/files.qip
      - name: Compile
        run: |
          if [ "${GITHUB_REF_NAME}" = test-snes-enhanced-inputs ]; then
            cd upstream
          fi
          docker run --rm -v "$PWD:/src" -w /src --entrypoint bash raetro/quartus:17.0 -ec '
            quartus_sh --version | tee quartus-version.txt
            grep -F "17.0.2 Build 602" quartus-version.txt
            quartus_sh --flow compile SNES'
      - name: Save build output for validation
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: SNES-candidate
          path: |
            output_files/*.rbf
            output_files/*.rpt
            output_files/*.summary
            quartus-version.txt
            upstream/output_files/*.rbf
            upstream/output_files/*.rpt
            upstream/output_files/*.summary
            upstream/quartus-version.txt
          if-no-files-found: error
